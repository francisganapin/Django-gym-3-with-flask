<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif; 
        background-color: #f4f6f9; 
        margin: 0; 
        display:center;
        }
        .container { display: flex; height: 100vh; }
        .sidebar { width: 250px; background: #1e3a8a; color: white; padding: 20px; }
        .sidebar h2 { font-size: 20px; margin-bottom: 20px; }
        .sidebar ul { list-style: none; padding: 0; }
        .sidebar ul li { padding: 10px 0; cursor: pointer; }
        .sidebar ul li:hover { background: #3b82f6; }
        .content { flex: 1; padding: 20px; }
        
        .dropdown {
            position: relative;
            display: block;
            margin-bottom: 10px;
        }
        .dropbtn {
            padding: 10px 15px;
            text-decoration: none;
            font-size: 18px;
            color: white;
            display: block;
            background: none;
            border: none;
            outline: none;
            text-align: left;
            width: 100%;
            cursor: pointer;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            left: 0;
            top: 100%;
            background-color: #3b86ff;
            width: 200px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 1;
        }
        .dropdown-content a {
            padding: 12px;
            display: block;
            color: white;
            text-decoration: none;
        }
        .dropdown-content a:hover {
            background-color: #2563eb;
        }
        .show { display: block; }
    </style>
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <h2>Gym Gimik</h2>
        <ul>
            <li><a href="{% url 'dashboard_views' %}">Dashboard</a></li>
            <div class="dropdown">
                <button class="dropbtn">Member <i class="fa fa-caret-down"></i></button>
                <div class="dropdown-content">
                    <a href="{% url 'member_list_view' %}">Member list</a>
                    <a href="{% url 'member_register_view' %}">Register</a>
                    <a href="{% url 'member_update_views' %}">Update</a>
                </div>
            </div>
            <div class="dropdown">
                <button class="dropbtn">Classes <i class="fa fa-caret-down"></i></button>
                <div class="dropdown-content">
                    <a href="{% url 'class_list_view' %}">Class List</a>
                    <a href="{% url 'class_register_view' %}">Register Class</a>
                    <a href="{% url 'member_update_views' %}">Update</a>
                </div>
            </div>
        </ul>
    </aside>
    <div class="content">
        {% block content %}
        {% endblock %}
    </div>
</div>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        document.addEventListener("click", function (event) {
            document.querySelectorAll(".dropdown-content").forEach(function (dropdown) {
                if (!dropdown.parentElement.contains(event.target)) {
                    dropdown.classList.remove("show");
                }
            });
        });
        
        document.querySelectorAll(".dropbtn").forEach(function (btn) {
            btn.addEventListener("click", function (event) {
                event.stopPropagation();
                let dropdownContent = this.nextElementSibling;
                dropdownContent.classList.toggle("show");
            });
        });
    });
</script>
</body>
</html>
