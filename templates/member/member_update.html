{% extends 'base.html' %}

{% block title %}Home{% endblock %}

{% block content %}


<style>
    /* Centering the form */
    .container_div {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f4f4f4;
        padding-left:500px;
    }

    form {
        background: #fff; 
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        width: 400px;
        text-align: center;
    }

    label {
        display: block;
        font-weight: bold;
    }

    input[type="text"],
    input[type="date"] {
        width: 80%;
        padding: 8px;
        margin-top: 5px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding-left:20px;
    }

    .submit-btn {
        background-color: #4CAF50;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    .submit-btn:hover {
        background-color: #45a049;
    }

    /* Table Wrapper (If Needed in Future) */
    #table-wrapper {
        position: relative;
    }

    #table-scroll {
        height: 600px;
        overflow: auto;
        margin-top: 20px;
    }

    #table-wrapper table {
        width: 100%;
    }

    #table-wrapper table * {
        background: white;
        color: black;
    }

    /* Not Used - Can Be Removed If Not Needed */
    #table-wrapper table thead th .text {
        position: absolute;
        top: -20px;
        z-index: 2;
        height: 200px;
        width: 35%;
        border: 1px solid red;
    }

    .filters {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
</style>




<div class="container_div">
    <div>
        <h2 style="text-align: center;">Member Update Expiry Form</h2>

        <form action="{% url 'member_update_views' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_card">ID Card:</label>
                <input type="text" id="id_card" name="id_card" required>
            </div>
            <div class="form-group">
                <label for="expiry">Expiry:</label>
                <input type="date" id="expiry" name="expiry" required>
            </div>
            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </div>
</div>

{% endblock %}
