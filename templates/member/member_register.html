{% extends 'base.html' %}

{% block title %}Home{% endblock %}

{% block content %}

<div class="container_div">
    <div class="form-container">
        <h2>Member Register Form</h2>

        <form action="{% url 'member_register_view' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_card">ID Card:</label>
                {{ message }}
                <input type="text" id="id_card" name="id_card"  value='GIMIK-{{random_id}}-MEMBER' readonly required>
            </div>
            <div class="form-group">
                <label for="expiry">Expiry:</label>
                <input type="date" id="expiry" name="expiry" required>
            </div>
            <div class="form-group">
                <label for="first_name">First Name:</label>
                <input type="text" id="first_name" name="first_name" required>
            </div>
            <div class="form-group">
                <label for="last_name">Last Name:</label>
                <input type="text" id="last_name" name="last_name" required>
            </div>
            <div class="form-group">
                <label for="gender">Gender:</label>
                <select id="gender" name="gender" required>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="address">Address:</label>
                <input type="text" id="address" name="address" required>
            </div>
            <div class="form-group">

                <label>Phone Number:</label>
                <div style="display: flex;">
                    <input type="text" value="+63" disabled style="width:50px;" readonly>
                    <input type="text" id="phone_number" name="phone_number" maxlength="10" required pattern="[0-9]+">
                </div>

            </div>
            <div class="form-group">
                <label for="profile_image">Profile Image:</label>
                <input type="file" id="profile_image" name="profile_image" accept="image/*" required>
            </div>
            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </div>
</div>

<style>
    /* Centering the form */
    .container_div {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .form-container {
        background: #fff; 
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        width: 450px;
        text-align: center;
        
    }

    h2 {
        margin-bottom: 20px;
        font-size: 22px;

    }

    .form-group {
        margin-bottom: 15px;
        text-align: left;
    }

    label {
        font-weight: bold;
        display: block;
        margin-bottom: 5px;
    }

    input[type="text"],
    input[type="date"],
    input[type="tel"],
    select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
    }

    input[type="file"] {
        width: 100%;
        border: none;
        font-size: 14px;
    }

    .submit-btn {
        background-color: #4CAF50;
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        width: 100%;
        transition: 0.3s;
    }

    .submit-btn:hover {
        background-color: #45a049;
    }
</style>

    


    
{% endblock %}
