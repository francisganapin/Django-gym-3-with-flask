{% extends 'base.html' %}

{% block title %}BMI Calculator{% endblock %}

{% block content %}

<div class="container_div">
    <div class="form-container">
        <h2>BMI Calculator Form</h2>

        <form action="{% url 'bmi_calculator' %}" method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="height_cm">Height (cm):</label>
                <input type="number" step="any" id="height_cm" name="height_cm" value="{{ height_cm }}">
            </div>

            <div class="form-group">
                <label for="weight_kg">Weight (kg):</label>
                <input type="number" step="any" id="weight_kg" name="weight_kg" value="{{ weight_kg }}">
            </div>

            <button type="submit" class="submit-btn">Submit</button>
        </form>

        {% if bmi %}
            <p><strong>Your BMI:</strong> {{ bmi }}</p>
        {% endif %}
    </div>
</div>

<style>
    .container_div {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .form-container {
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        width: 450px;
        text-align: center;
    }

    h2 {
        margin-bottom: 20px;
        font-size: 22px;
    }

    .form-group {
        margin-bottom: 15px;
        text-align: left;
    }

    label {
        font-weight: bold;
        display: block;
        margin-bottom: 5px;
    }

    input[type="number"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
    }

    .submit-btn {
        background-color: #4CAF50;
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        width: 100%;
        transition: 0.3s;
    }

    .submit-btn:hover {
        background-color: #45a049;
    }
</style>

{% endblock %}
